<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>

    <div class="container">

        <h1>My Notes</h1>

        <input 
            type="text" 
            id="title" 
            placeholder="Enter title"
        >

        <textarea 
            id="content" 
            placeholder="Write your note">
        </textarea>

        <button onclick="createNote()">
            Create Note
        </button>

        <div id="notes">

        </div>

    </div>

    <script src="./js/dashboard.js"></script>

</body>
</html>
